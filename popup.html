<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Screen Clip Reader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup">
  <main>
    <div class="brand"><span class="logo">⌗</span><div><h1>Screen Clip Reader</h1><p>Copy pixels or read text from anything visible.</p></div></div>
    <button id="select" class="primary">Select an area</button>
    <button id="youtube">Copy YouTube captions</button>
    <p id="status" role="status">Works with images, paused videos, PDFs, canvas, and ordinary webpages.</p>
    <small>OCR runs locally. Protected browser pages and DRM-protected video may block capture.</small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
